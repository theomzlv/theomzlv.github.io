<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Théo MAZZALOVO - Portfolio BTS SIO SISR</title>
<meta name="author" content="Théo MAZZALOVO">
<meta name="description" content="Théo MAZZALOVO - étudiant en BTS SIO option SISR. Passionné de cybersécurité, alternant au sein du cabinet Sologest.">
<meta name="theme-color" content="#44ccee">

<script>
/* Applique le thème enregistré avant l'affichage (évite le flash) */
(function(){
  try{
    var t = localStorage.getItem('theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<style>
/* ============ COULEURS (modifiables ici) ============ */
:root{
  --accent:#44ccee;
  --accent-dark:#0b86a6;
  --bg:#f3f7f9;
  --surface:#ffffff;
  --text:#1b2630;
  --muted:#5d6e7b;
  --border:#dce5eb;
  --orange-bg:#fff1dc;
  --orange-border:#f59e0b;
  --orange-text:#5b3a00;
  --side-bg:#ffffff;
  --side-w:280px;
}
:root[data-theme="dark"]{
  --accent-dark:#44ccee;
  --bg:#0e1418;
  --surface:#162027;
  --text:#e7eef2;
  --muted:#9aabb7;
  --border:#25333c;
  --orange-bg:#2b1f0a;
  --orange-text:#ffe3b3;
  --side-bg:#121a20;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ============ BANDEAU DE GAUCHE ============ */
.sidebar{position:fixed;top:0;bottom:0;left:0;width:var(--side-w);background:var(--side-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:2rem 1.25rem 1.25rem;z-index:20;overflow-y:auto}
.brand h2{font-size:1.3rem;line-height:1.2}
.brand p{color:var(--muted);font-size:.85rem;margin-top:.35rem}

.menu{list-style:none;margin-top:2.25rem}
.menu a{display:block;padding:.6rem .9rem;border-radius:8px;text-decoration:none;border-left:3px solid transparent}
.menu a:hover{background:var(--bg)}
.menu a.active{background:var(--bg);border-left-color:var(--accent);font-weight:600}
.menu .sub{list-style:none;margin:.15rem 0 .4rem 1.1rem;border-left:1px solid var(--border)}
.menu .sub a{font-size:.95rem;color:var(--muted)}
.menu .sub a.active{color:var(--text)}

.side-bottom{margin-top:auto}
.socials{display:flex;gap:.6rem;margin-bottom:1rem}
.socials a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--border);color:var(--text)}
.socials a:hover{border-color:var(--accent);color:var(--accent-dark)}
.socials svg{width:18px;height:18px;fill:currentColor}

.theme-btn{display:flex;align-items:center;gap:.6rem;width:100%;padding:.55rem .9rem;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font:inherit;font-size:.875rem;cursor:pointer}
.theme-btn:hover{border-color:var(--accent)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:inset -4px -2px 0 0 var(--bg)}
[data-theme="light"] .dot{box-shadow:none}
.copy{font-size:.75rem;color:var(--muted);margin-top:1rem}

/* ============ CONTENU ============ */
main{margin-left:var(--side-w)}
section{padding:5rem 3rem;max-width:1000px}

/* Accueil */
.hero{min-height:100vh;max-width:none;display:flex;flex-direction:column;justify-content:center;
  background:linear-gradient(135deg,rgba(68,204,238,.16),transparent 55%)}
.hero .small{color:var(--muted);margin-bottom:.8rem;animation:rise .7s both}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);line-height:1.05;letter-spacing:-.02em;animation:rise .7s .1s both}
.hero .role{margin-top:1rem;font-size:1.4rem;font-weight:600;color:var(--accent-dark);animation:rise .7s .2s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Titres de sections */
h2.title{font-size:2rem;display:inline-block;padding-bottom:.4rem;margin-bottom:1.6rem;border-bottom:3px solid var(--accent)}

/* Profil */
.profil-text p{font-size:1.1rem;max-width:62ch;margin-bottom:.7rem}
.orange{margin-top:1.75rem;max-width:68ch;padding:1.25rem 1.5rem;background:var(--orange-bg);color:var(--orange-text);border-left:5px solid var(--orange-border);border-radius:10px}
.orange p+p{margin-top:.6rem}
.stats{margin-top:2.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem 1rem;text-align:center}
.stat b{display:block;font-size:2.4rem;line-height:1.1;color:var(--accent-dark)}
.stat span{color:var(--muted);font-size:.95rem}

/* Parcours */
#parcours{max-width:1150px}
.parcours-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2.5rem}
.parcours-column>h3{display:flex;align-items:center;gap:.6rem;font-size:1.3rem;margin-bottom:1.5rem}
.parcours-column>h3 svg{width:1.4rem;height:1.4rem;fill:var(--accent-dark)}
.timeline{position:relative;padding-left:1.75rem;border-left:3px solid var(--accent)}
.timeline-item{position:relative;margin-bottom:2rem}
.timeline-item::before{content:"";position:absolute;left:calc(-1.75rem - 9px);top:.35rem;width:15px;height:15px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.timeline-date{display:inline-block;margin-bottom:.6rem;padding:.15rem .8rem;border-radius:20px;background:var(--accent);color:#06202a;font-size:.85rem;font-weight:600}
.timeline-content{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.25rem}
.timeline-content h3{font-size:1.1rem;margin-bottom:.5rem}
.timeline-content p{font-size:.95rem;margin-bottom:.35rem}
.hl{color:var(--accent-dark);font-weight:600}
.timeline-btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:.6rem;padding:.45rem 1rem;border-radius:8px;border:1px solid var(--accent);color:var(--accent-dark);font-size:.9rem;font-weight:600;text-decoration:none}
.timeline-btn:hover{background:var(--accent);color:#06202a}
.timeline-btn svg{width:14px;height:14px;fill:currentColor}

.parcours-pro{--accent:var(--orange-border);--accent-dark:#b45309}
:root[data-theme="dark"] .parcours-pro{--accent-dark:#f59e0b}

/* Compétences */
#competences{max-width:1150px}
.skill-category{margin-bottom:2.5rem}
.skill-category>h3{display:flex;align-items:center;gap:.6rem;font-size:1.3rem;margin-bottom:1rem}
.skill-category>h3 svg{width:1.4rem;height:1.4rem;fill:var(--accent-dark)}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}
.skill-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;min-height:120px;padding:1.25rem 1rem;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;transition:transform .2s,border-color .2s}
.skill-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.skill-icon{width:2.4rem;height:2.4rem;fill:var(--accent-dark)}
.skill-name{font-size:.95rem;font-weight:600}

/* Projets */
.projects-navigation{text-align:center;max-width:900px;margin:0 auto}
.projects-navigation>h3{font-size:1.6rem;margin-bottom:.4rem}
.projects-navigation>p{color:var(--muted);margin-bottom:2rem}
.projects-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem;text-align:left}
.project-nav-btn{display:flex;align-items:center;gap:1rem;padding:1.25rem 1.4rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;transition:transform .2s,border-color .2s}
.project-nav-btn:hover{transform:translateY(-4px);border-color:var(--accent)}
.btn-icon{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--bg)}
.btn-icon svg{width:26px;height:26px;fill:var(--accent-dark)}
.btn-text{flex:1}
.btn-title{display:block;font-weight:700;font-size:1.05rem}
.btn-description{display:block;color:var(--muted);font-size:.9rem}
.btn-arrow svg{width:20px;height:20px;fill:var(--accent-dark)}

/* Contact */
#contact{max-width:1150px}
.contact-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2rem}
.contact-info,.contact-form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.75rem}
.contact-info h3{font-size:1.3rem;margin-bottom:1.1rem}
.contact-info p{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.contact-info p svg{flex:none;width:20px;height:20px;fill:var(--accent-dark)}
.contact-social{display:flex;gap:.6rem;margin-top:1.25rem}
.contact-social a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--border)}
.contact-social a:hover{border-color:var(--accent)}
.contact-social svg{width:18px;height:18px;fill:currentColor}
.contact-form{display:flex;flex-direction:column;gap:1rem}
.contact-form input,.contact-form textarea{width:100%;padding:.8rem 1rem;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px}
.contact-form input:focus,.contact-form textarea:focus{border-color:var(--accent);outline:2px solid var(--accent)}
.contact-form textarea{min-height:150px;resize:vertical}
.contact-form button{padding:.8rem 1.4rem;font:inherit;font-weight:700;color:#06202a;background:var(--accent);border:0;border-radius:8px;cursor:pointer}
.contact-form button:hover{filter:brightness(1.08)}
#formResponse{font-size:.9rem;color:var(--muted)}

.projects-buttons .project-nav-btn{background:var(--orange-bg);border-color:var(--orange-border);color:var(--orange-text)}
.projects-buttons .project-nav-btn:hover{border-color:var(--orange-border);box-shadow:0 6px 18px rgba(245,158,11,.28)}
.projects-buttons .btn-icon{background:rgba(245,158,11,.2)}
.projects-buttons .btn-icon svg,.projects-buttons .btn-arrow svg{fill:var(--orange-border)}
.projects-buttons .btn-description{color:inherit;opacity:.8}
.map-container{margin-top:1.25rem}
.map-container iframe{display:block;width:100%;height:230px;border:0;border-radius:10px}
.map-link{display:inline-block;margin-top:.4rem;font-size:.8rem;color:var(--muted)}
.logo{display:block;margin-bottom:1.25rem}
.logo img{display:block;width:100%;height:auto;border-radius:10px}

/* Page BTS SIO (cachée tant qu'on ne clique pas sur "En savoir plus") */
.bts-view{display:none}
body.bts-open .bts-view{display:block}
body.bts-open main>section,body.ps-open main>section,body.pp-open main>section,body.legal-open main>section{display:none}
.menu li.bts-nav{display:none}
body.bts-open .menu li.bts-nav{display:block}
body.bts-open .home-sub,body.ps-open .home-sub,body.pp-open .home-sub,body.legal-open .home-sub{display:none}
body.bts-open .bts-parent{background:var(--bg);border-left-color:var(--accent);font-weight:600;color:var(--accent-dark)}
.bts-view>section{max-width:1150px;padding:3.5rem 3rem}
.bts-heading{position:relative;text-align:center;font-size:clamp(1.9rem,4vw,2.8rem);color:var(--accent-dark);padding-bottom:1.1rem;margin-bottom:2rem}
.bts-heading::after{content:"";position:absolute;left:0;bottom:0;width:100px;height:3px;background:var(--accent)}
.bts-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem}
.bts-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:2.2rem 2rem}
.bts-card svg{width:3.2rem;height:3.2rem;fill:var(--accent-dark);margin-bottom:1.6rem}
.bts-card h3{font-size:1.2rem;margin-bottom:1rem}
.bts-card p{color:var(--text);opacity:.9}
.option-cards{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.option-card{position:relative}
.option-card.chosen{border:2px solid var(--accent)}
.option-head{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.option-head svg{width:2.6rem;height:2.6rem;margin:0}
.option-head h3{flex:1;margin:0;font-size:1.35rem}
.option-badge{padding:.3rem .9rem;border-radius:20px;background:var(--accent);color:#06202a;font-size:.8rem;font-weight:700;white-space:nowrap}

.blocs-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.bloc-card h3{font-size:1.25rem;margin-bottom:.8rem}
.bloc-card h4{margin:1.2rem 0 .6rem;font-size:1rem;color:var(--accent-dark)}
.bloc-list{list-style:none}
.bloc-list li{position:relative;padding-left:1.6rem;margin-bottom:.5rem;font-size:.95rem}
.bloc-list li::before{content:"\2713";position:absolute;left:0;color:var(--accent-dark);font-weight:700}

.cv-actions{margin:-.5rem 0 2rem}
.cv-btn{display:inline-flex;align-items:center;gap:.6rem;padding:.7rem 1.4rem;border-radius:10px;background:var(--accent);color:#06202a;font-weight:700;text-decoration:none;transition:transform .2s,filter .2s}
.cv-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.cv-btn svg{width:18px;height:18px;fill:currentColor}
.cert-message+.cert-message{margin-top:1rem}
.cert-message{max-width:68ch;padding:1.4rem 1.6rem;background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:12px;font-size:1.1rem}

.ps-view{display:none}
body.ps-open #ps,body.pp-open #pp{display:block}
.menu li.ps-nav,.menu li.pp-nav{display:none}
body.ps-open .menu li.ps-nav,body.pp-open .menu li.pp-nav{display:block}
body.ps-open .ps-parent,body.pp-open .pp-parent{background:var(--bg);border-left-color:var(--accent);font-weight:600;color:var(--accent-dark)}
.ps-view>section{max-width:1150px;padding:2.5rem 3rem}
.ps-view>section#ps-top,.ps-view>section#pp-top{padding-top:3.5rem}
.back-link{display:inline-flex;align-items:center;gap:.5rem;margin-bottom:1.5rem;color:var(--muted);font-size:.95rem}
.back-link:hover{color:var(--accent-dark)}
.back-link svg{width:18px;height:18px;fill:currentColor}
.ps-intro{text-align:center;color:var(--muted);max-width:60ch;margin:-.5rem auto 1.5rem}
.doc-filters{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
.doc-chip{padding:.45rem 1.1rem;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:.9rem;cursor:pointer}
.doc-chip:hover{border-color:var(--accent)}
.doc-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#06202a;font-weight:700}
.ps-cat>h3{display:flex;align-items:center;gap:.6rem;font-size:1.4rem;margin-bottom:1.1rem}
.ps-cat>h3 svg{width:1.5rem;height:1.5rem;fill:var(--accent-dark)}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.1rem}
.doc-grid.vide::before{content:"Documents à venir";color:var(--muted);font-style:italic}
.doc-card{display:flex;flex-direction:column;gap:.5rem;padding:1.3rem 1.4rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;transition:transform .2s,border-color .2s}
.doc-card[hidden]{display:none}
.doc-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.doc-type{align-self:flex-start;padding:.15rem .7rem;border-radius:20px;background:var(--accent);color:#06202a;font-size:.75rem;font-weight:700}
.doc-card h4{font-size:1.05rem}
.doc-card p{color:var(--muted);font-size:.92rem;flex:1}
.doc-btn{align-self:flex-start;margin-top:.4rem;padding:.45rem 1rem;border:1px solid var(--accent);border-radius:8px;color:var(--accent-dark);font-size:.9rem;font-weight:600}
.doc-btn:hover{background:var(--accent);color:#06202a}

.doc-types{display:flex;flex-wrap:wrap;gap:.4rem}
.doc-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.4rem}
.doc-actions .doc-btn{margin-top:0}
.doc-btn.alt{border-color:var(--border);color:var(--muted)}
.doc-btn.alt:hover{background:var(--bg);border-color:var(--accent);color:var(--text)}
.ps-note{text-align:center;color:var(--muted);font-size:.85rem;max-width:60ch;margin:1.1rem auto 0}

/* ========================================================= */
/* FOND ANIMÉ : Halos, anneaux, réseau et formes mobiles     */
/* ========================================================= */
.bg-shapes{--c1:var(--accent);--c2:var(--orange-border);position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
[data-theme="light"] .bg-shapes{--c1:var(--accent-dark);--c2:#d97706}
.bg-ambient{position:absolute;inset:0;background:
  radial-gradient(48vw 44vh at 88% 8%,rgba(68,204,238,.30),transparent 70%),
  radial-gradient(44vw 42vh at 34% 100%,rgba(245,158,11,.24),transparent 70%),
  radial-gradient(38vw 36vh at 62% 52%,rgba(68,204,238,.16),transparent 70%),
  radial-gradient(32vw 32vh at 100% 82%,rgba(245,158,11,.20),transparent 70%);
  animation: ambientShift 15s ease-in-out infinite alternate;
}
[data-theme="light"] .bg-ambient{background:
  radial-gradient(48vw 44vh at 88% 8%,rgba(68,204,238,.22),transparent 70%),
  radial-gradient(44vw 42vh at 34% 100%,rgba(245,158,11,.16),transparent 70%),
  radial-gradient(38vw 36vh at 62% 52%,rgba(68,204,238,.10),transparent 70%),
  radial-gradient(32vw 32vh at 100% 82%,rgba(245,158,11,.13),transparent 70%)}
#bgNet{position:absolute;inset:0;width:100%;height:100%}
.bg-shapes span,.bg-shapes svg{position:absolute;display:block}
svg.bg-ico,.bg-sym{will-change:transform}
.bg-blob{border-radius:50%;opacity:.5;background:radial-gradient(circle,var(--c1) 0,transparent 68%)}
[data-theme="light"] .bg-blob{opacity:.36}
.bg-blob.or{background:radial-gradient(circle,var(--c2) 0,transparent 68%);opacity:.42}
[data-theme="light"] .bg-blob.or{opacity:.3}

/* Animation fluide des formes du fond */
.b1{width:600px;height:600px;top:-170px;right:-150px;animation:dA 18s ease-in-out infinite alternate}
.b2{width:500px;height:500px;bottom:-160px;left:22%;animation:dB 22s ease-in-out infinite alternate}
.b3{width:420px;height:420px;top:34%;left:42%;animation:dC 25s ease-in-out infinite alternate}
.b4{width:460px;height:460px;top:58%;right:-130px;animation:dA 20s ease-in-out infinite alternate-reverse}
.b5{width:400px;height:400px;top:-150px;left:38%;animation:dB 24s ease-in-out infinite alternate-reverse}

.bg-ring{border:2px solid var(--c1);border-radius:50%;opacity:.4}
.bg-ring.or{border-color:var(--c2)}
.r1{width:170px;height:170px;top:12%;left:34%;animation:dB 14s ease-in-out infinite alternate}
.r2{width:100px;height:100px;bottom:16%;right:9%;animation:dA 12s ease-in-out infinite alternate}
.bg-ping{width:220px;height:220px;border:2px solid var(--c1);border-radius:50%;opacity:0;animation:ping 4s ease-out infinite}
.g1{top:20%;left:46%}
.g2{top:62%;right:12%;animation-delay:-2s;border-color:var(--c2)}

svg.bg-ico{width:54px;height:54px;fill:currentColor;opacity:.62}
svg.bg-ico.bl{color:var(--c1)}
svg.bg-ico.or{color:var(--c2)}
svg.bg-ico.f1{animation:fl1 14s ease-in-out infinite alternate}
svg.bg-ico.f2{animation:fl2 16s ease-in-out infinite alternate}
svg.bg-ico.f3{animation:fl3 12s ease-in-out infinite alternate}
svg.bg-ico.f4{animation:fl4 18s ease-in-out infinite alternate}

.bg-sym{bottom:-10vh;color:var(--c1);opacity:.5;font:700 1.5rem/1 ui-monospace,Consolas,"Courier New",monospace;white-space:nowrap;animation:riseSym 15s linear infinite}
.bg-sym.or{color:var(--c2);opacity:.55}

@keyframes ambientShift{
  0%{filter:hue-rotate(0deg) scale(1);}
  100%{filter:hue-rotate(15deg) scale(1.05);}
}
@keyframes dA{from{transform:translate(0,0) rotate(0)}to{transform:translate(-15vw,18vh) rotate(120deg)}}
@keyframes dB{from{transform:translate(0,0) rotate(0)}to{transform:translate(18vw,-18vh) rotate(-100deg)}}
@keyframes dC{from{transform:translate(0,0) scale(1) rotate(0deg)}to{transform:translate(-12vw,-20vh) scale(1.35) rotate(45deg)}}
@keyframes fl1{from{transform:translate(0,0) rotate(-15deg)}to{transform:translate(25vw,-20vh) rotate(45deg)}}
@keyframes fl2{from{transform:translate(0,0) rotate(15deg)}to{transform:translate(-25vw,20vh) rotate(-45deg)}}
@keyframes fl3{from{transform:translate(0,0) rotate(0) scale(.9)}to{transform:translate(18vw,25vh) rotate(30deg) scale(1.2)}}
@keyframes fl4{from{transform:translate(0,0) rotate(-10deg) scale(1.1)}to{transform:translate(-22vw,-18vh) rotate(-40deg) scale(.85)}}
@keyframes ping{0%{transform:scale(.1);opacity:.8}100%{transform:scale(1.2);opacity:0}}
@keyframes riseSym{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-120vh) rotate(20deg)}}

main{position:relative;z-index:1}
@media(max-width:800px){.bg-ring{display:none}svg.bg-ico.x{display:none}svg.bg-ico{width:42px;height:42px}}
@media(prefers-reduced-motion:reduce){.bg-shapes span,.bg-shapes svg{animation:none!important}.bg-ping{display:none}}

/* Orange (celui du Parcours professionnel) : notes de Certifications et documents des Projets scolaires */
.cert-message{background:var(--orange-bg);border-color:var(--orange-border);border-left-color:var(--orange-border);color:var(--orange-text)}
.doc-card{--accent:var(--orange-border);--accent-dark:#b45309;background:var(--orange-bg);border-color:var(--orange-border);color:var(--orange-text)}
:root[data-theme="dark"] .doc-card{--accent-dark:#f59e0b}
.doc-card p{color:inherit;opacity:.85}
.doc-card .doc-btn.alt{border-color:rgba(245,158,11,.55);color:var(--orange-text)}
.doc-card .doc-btn.alt:hover{background:var(--orange-border);border-color:var(--orange-border);color:#06202a}

/* Mentions légales et CGU (page cachée) + pied de page */
.legal-view{display:none}
body.legal-open .legal-view{display:block}
.legal-view>section{max-width:900px;padding:2.5rem 3rem}
.legal-view h3{margin:1.8rem 0 .5rem;font-size:1.15rem;color:var(--accent-dark)}
.legal-view p,.legal-view li{margin-bottom:.6rem}
.legal-view ul{padding-left:1.4rem;margin-bottom:.6rem}
.legal-view a{color:var(--accent-dark);text-decoration:underline}
.legal-update{color:var(--muted);font-size:.85rem}
.site-footer{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;padding:1.5rem 3rem 2.5rem;color:var(--muted);font-size:.85rem}
.site-footer a:hover,.legal-links a:hover{color:var(--accent-dark);text-decoration:underline}
.legal-links{margin-top:.5rem}
/* ============ MOBILE ============ */
@media(max-width:800px){
  .sidebar{position:sticky;top:0;bottom:auto;width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.7rem 1rem;border-right:0;border-bottom:1px solid var(--border)}
  .brand p,.copy,.socials{display:none}
  .logo{width:105px;margin:0}
  .menu{margin:0 0 0 auto;display:flex;flex-wrap:wrap;gap:.1rem}
  .menu li{list-style:none;display:flex;flex-wrap:wrap}
  .menu .sub{margin:0;border:0;display:flex;flex-wrap:wrap}
  .menu a{padding:.35rem .6rem;font-size:.85rem}
  .menu .sub a{font-size:.85rem}
  body.bts-open .menu li.bts-nav,body.ps-open .menu li.ps-nav,body.pp-open .menu li.pp-nav{display:flex}
  .ps-view>section{padding:2rem 1.25rem}
  .legal-view>section{padding:2rem 1.25rem}
  .site-footer{padding:1.5rem 1.25rem 2rem}
  .bts-view>section{padding:2.5rem 1.25rem}
  .side-bottom{margin:0}
  .theme-btn{width:auto}.theme-btn span:last-child{display:none}
  main{margin-left:0}
  section{padding:3rem 1.25rem}
  .hero{min-height:75vh}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero *{animation:none!important}}
</style>
</head>
